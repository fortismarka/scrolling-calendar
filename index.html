<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon — Planning Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #1b2240;
    --navy-mid: #253059;
    --navy-light: #3a4a7a;
    --today-color: #d95f00;
    --today-bg: #fff4ec;
    --select-color: #1a73e8;
    --select-bg: #e8f0fe;
    --month-a: #ffffff;
    --month-b: #f3f7fd;
    --holiday-a: #fffaf3;
    --holiday-b: #fef5e7;
    --border-main: #dde3ed;
    --border-month: #b8c4d8;
    --text-main: #1e2740;
    --text-muted: #6b7694;
    --text-week: #8892b0;
    --header-h: 56px;
    --cell-h: 58px;
  }

  html, body {
    height: 100%;
    background: #161d35;
    font-family: 'Figtree', sans-serif;
    color: var(--text-main);
  }

  .page-outer {
    display: flex;
    justify-content: center;
    height: 100vh;
    background: #161d35;
  }

  .page {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    width: 100%;
    max-width: 920px;
    box-shadow: 0 0 40px rgba(0,0,0,0.4);
  }

  /* ── TOP HEADER BAR ── */
  .topbar {
    height: var(--header-h);
    background: var(--navy);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 14px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    z-index: 100;
  }

  .topbar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .topbar-logo svg {
    width: 26px;
    height: 26px;
    opacity: 0.9;
  }

  .topbar-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ffffff;
    opacity: 0.9;
  }

  .topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .today-badge {
    background: transparent;
    border: 1.5px solid var(--today-color);
    color: var(--today-color);
    font-family: 'Figtree', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .today-badge:hover {
    background: var(--today-color);
    color: white;
  }

  /* ── CALENDAR SCROLL AREA ── */
  .cal-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: auto;
    background: white;
  }

  /* ── TABLE ── */
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 680px;
    table-layout: fixed;
  }

  colgroup col.col-month { width: 46px; }
  colgroup col.col-week  { width: 44px; }
  colgroup col.col-day   { width: calc((100% - 82px) / 7); }

  /* ── STICKY COLUMN HEADERS ── */
  thead {
    position: sticky;
    top: 0;
    z-index: 50;
  }

  thead tr th {
    background: var(--navy);
    color: rgba(255,255,255,0.85);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    text-align: center;
    padding: 10px 4px;
    border-right: 1px solid var(--navy-light);
    border-bottom: 2px solid var(--navy-light);
  }

  thead tr th.th-month {
    font-size: 9px;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.3);
  }

  thead tr th.th-week {
    font-size: 9.5px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.45);
  }

  thead tr th:last-child { border-right: none; }

  thead tr th.th-sun,
  thead tr th.th-sat {
    color: rgba(255,200,150,0.85);
  }

  /* ── MONTH LABEL CELL ── */
  td.month-label {
    background: var(--navy);
    color: rgba(255,255,255,0.75);
    text-align: center;
    vertical-align: middle;
    padding: 0;
    border-right: 2px solid var(--navy-light);
    border-bottom: 1px solid var(--navy-mid);
    cursor: pointer;
    transition: filter 0.15s;
  }

  td.month-label:hover { filter: brightness(1.15); }

  td.month-label .month-inner {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    gap: 3px;
  }

  td.month-label .month-name {
    writing-mode: vertical-lr;
    transform: rotate(180deg);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    text-align: center;
  }

  td.month-label .month-year {
    writing-mode: vertical-lr;
    transform: rotate(180deg);
    font-size: 8px;
    font-weight: 400;
    letter-spacing: 0.8px;
    color: rgba(255,255,255,0.32);
    font-family: 'DM Mono', monospace;
    text-align: center;
  }

  td.month-label.ml-even {
    background: linear-gradient(180deg, #1e2a4a 0%, #1b2240 100%);
  }
  td.month-label.ml-odd {
    background: linear-gradient(180deg, #263352 0%, #1e2a4a 100%);
  }

  /* ── WEEK NUMBER CELL ── */
  td.week-num {
    background: #f7f9fc;
    text-align: center;
    vertical-align: middle;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-week);
    cursor: pointer;
    border-right: 1px solid var(--border-main);
    border-bottom: 1px solid var(--border-main);
    user-select: none;
    transition: background 0.12s, color 0.12s;
    font-family: 'DM Mono', monospace;
  }

  td.week-num:hover {
    background: #eaeffa;
    color: var(--select-color);
  }

  /* ── DAY CELLS ── */
  td.day-cell {
    text-align: center;
    vertical-align: middle;
    height: var(--cell-h);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border-right: 1px solid var(--border-main);
    border-bottom: 1px solid var(--border-main);
    position: relative;
    user-select: none;
    transition: background 0.1s;
    font-variant-numeric: tabular-nums;
  }

  td.day-cell:last-child { border-right: none; }

  td.day-cell:hover:not(.today):not(.drag-range) {
    background: #eef3fb !important;
  }

  /* ── MONTH ALTERNATING BACKGROUNDS ── */
  td.month-even { background: var(--month-a); }
  td.month-odd  { background: var(--month-b); }

  /* ── MONTH BOUNDARY ── */
  td.month-start {
    border-left: 2px solid var(--border-month) !important;
  }

  /* ── HOLIDAY ── */
  td.day-cell.holiday.month-even { background: var(--holiday-a); }
  td.day-cell.holiday.month-odd  { background: var(--holiday-b); }

  td.day-cell.holiday::before {
    content: '';
    position: absolute;
    top: 5px;
    right: 5px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #e8a040;
    opacity: 0.7;
  }

  td.day-cell.holiday::after {
    content: attr(data-holiday);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: #1b2240;
    color: white;
    padding: 4px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 500;
    white-space: nowrap;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    font-family: 'Figtree', sans-serif;
    letter-spacing: 0.2px;
  }

  td.day-cell.holiday:hover::after { opacity: 1; }

  td.day-cell.holiday-named .holiday-nick {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.15;
  }

  td.day-cell.holiday-named .holiday-nick .hk-name {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: #b36a00;
    line-height: 1.2;
    text-align: center;
  }

  td.day-cell.holiday-named .holiday-nick .hk-date {
    font-size: 9px;
    font-weight: 400;
    color: #c49040;
    opacity: 0.75;
    font-family: 'DM Mono', monospace;
  }

  /* ── TODAY ── */
  td.day-cell.today {
    border: 3px solid var(--today-color) !important;
    background: var(--today-bg) !important;
    font-weight: 700;
    color: var(--today-color);
    z-index: 5;
  }

  /* ── DRAG RANGE SELECTION ── */
  td.drag-range {
    background: var(--select-bg) !important;
    color: var(--select-color);
    border-color: rgba(26,115,232,0.18) !important;
  }
  td.drag-t { border-top:    2.5px solid var(--select-color) !important; }
  td.drag-b { border-bottom: 2.5px solid var(--select-color) !important; }
  td.drag-l { border-left:   2.5px solid var(--select-color) !important; }
  td.drag-r { border-right:  2.5px solid var(--select-color) !important; }

  /* ── SELECTED MONTH ── */
  td.mhl {
    background: var(--select-bg) !important;
    color: var(--select-color);
    border-color: rgba(26,115,232,0.18) !important;
  }
  td.mhl-t { border-top:    2.5px solid var(--select-color) !important; }
  td.mhl-b { border-bottom: 2.5px solid var(--select-color) !important; }
  td.mhl-l { border-left:   2.5px solid var(--select-color) !important; }
  td.mhl-r { border-right:  2.5px solid var(--select-color) !important; }
  td.month-label.selected-month-label {
    border: 2.5px solid var(--select-color) !important;
    filter: brightness(1.25);
  }

  /* ── SELECTED WEEK ── */
  tr.selected-week td:not(.month-label) {
    background: var(--select-bg) !important;
    border-top: 2.5px solid var(--select-color) !important;
    border-bottom: 2.5px solid var(--select-color) !important;
    color: var(--select-color);
  }

  tr.selected-week td.week-num {
    border-left: 2.5px solid var(--select-color) !important;
    color: var(--select-color);
    font-weight: 700;
  }

  tr.selected-week td.day-cell:last-child {
    border-right: 2.5px solid var(--select-color) !important;
  }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    :root {
      --header-h: 44px;
      --cell-h: 44px;
    }

    .page { max-width: 100%; }

    .topbar { padding: 0 10px; gap: 6px; }
    .topbar-logo svg { width: 20px; height: 20px; }
    .topbar-title { font-size: 11px; letter-spacing: 1px; }
    .built-by { display: none; }
    .today-badge { font-size: 10px; padding: 3px 8px; letter-spacing: 0.3px; }
    .diff-circle { width: 28px; height: 28px; }
    .diff-circle .diff-num { font-size: 9px; }

    .cal-scroll { overflow-x: hidden; }
    table { min-width: 0; }

    colgroup col.col-month { width: 22px; }
    colgroup col.col-week  { width: 20px; }
    colgroup col.col-day   { width: calc((100% - 42px) / 7); }

    td.month-label .month-name { font-size: 9px; letter-spacing: 1px; }
    td.month-label .month-year { display: none; }

    td.week-num { font-size: 8px; }
    td.day-cell { font-size: 11px; font-weight: 400; }

    td.day-cell.holiday-named .holiday-nick .hk-name { font-size: 7px; }
    td.day-cell.holiday-named .holiday-nick .hk-date { font-size: 6.5px; }

    thead tr th { font-size: 9px; letter-spacing: 0.5px; padding: 7px 2px; }
    thead tr th.th-month { font-size: 7px; }
    thead tr th.th-week  { font-size: 7px; }

    .legend { bottom: 8px; right: 8px; padding: 6px 10px; gap: 10px; font-size: 9px; }
    .legend-swatch { width: 11px; height: 11px; }
  }

  /* ── SCROLLBAR ── */
  .cal-scroll::-webkit-scrollbar { width: 6px; }
  .cal-scroll::-webkit-scrollbar-track { background: #f0f2f7; }
  .cal-scroll::-webkit-scrollbar-thumb { background: #c0c8dc; border-radius: 3px; }
  .cal-scroll::-webkit-scrollbar-thumb:hover { background: #9baac8; }

  /* ── BUILT BY ── */
  .built-by {
    font-size: 9px;
    font-weight: 400;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.4px;
    margin-top: 1px;
  }
  .built-by a {
    color: rgba(255,255,255,0.35);
    text-decoration: none;
  }
  .built-by a:hover { color: rgba(255,255,255,0.6); text-decoration: underline; }

  /* ── DAY COUNTER CIRCLE ── */
  .diff-circle {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .diff-circle.has-value {
    border-color: var(--select-color);
    background: rgba(26,115,232,0.15);
  }
  .diff-circle .diff-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,0.2);
    line-height: 1;
    transition: all 0.2s;
  }
  .diff-circle.has-value .diff-num { color: #7eb8ff; }

  /* ── LEGEND ── */
  .legend {
    position: fixed;
    bottom: 14px;
    right: 16px;
    background: white;
    border: 1px solid var(--border-main);
    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    gap: 14px;
    align-items: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    z-index: 90;
    font-size: 10.5px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .legend-swatch {
    width: 13px;
    height: 13px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .ls-today   { border: 2.5px solid var(--today-color); background: var(--today-bg); }
  .ls-select  { border: 2.5px solid var(--select-color); background: var(--select-bg); }
  .ls-holiday { background: var(--holiday-a); border: 1px solid #e8c080; position: relative; }
  .ls-holiday::after {
    content: '';
    position: absolute;
    top: 1px; right: 1px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #e8a040;
  }
</style>
</head>
<body>
<div class="page-outer">
<div class="page">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-logo">
      <svg viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="4" width="24" height="21" rx="2.5" stroke="white" stroke-width="1.5" fill="none" opacity="0.7"/>
        <path d="M1 9h24" stroke="white" stroke-width="1.5" opacity="0.7"/>
        <rect x="6" y="1" width="2.5" height="6" rx="1.25" fill="white" opacity="0.7"/>
        <rect x="17.5" y="1" width="2.5" height="6" rx="1.25" fill="white" opacity="0.7"/>
        <rect x="5.5" y="13" width="4" height="4" rx="0.8" fill="white" opacity="0.5"/>
        <rect x="11" y="13" width="4" height="4" rx="0.8" fill="white" opacity="0.5"/>
        <rect x="16.5" y="13" width="4" height="4" rx="0.8" fill="#d95f00" opacity="0.9"/>
        <rect x="5.5" y="19" width="4" height="3" rx="0.8" fill="white" opacity="0.3"/>
        <rect x="11" y="19" width="4" height="3" rx="0.8" fill="white" opacity="0.3"/>
      </svg>
    </div>
    <div>
      <div class="topbar-title">Horizon</div>
      <div class="built-by">by <a href="https://fortismarka.com" target="_blank">Fortis Marka</a></div>
    </div>
    <div class="topbar-right">
      <div class="diff-circle" id="diffCircle">
        <span class="diff-num" id="diffNum">—</span>
      </div>
      <button class="today-badge" onclick="scrollToToday()">⬤ Today</button>
    </div>
  </header>

  <!-- CALENDAR SCROLL -->
  <div class="cal-scroll" id="calScroll">
    <table id="calTable">
      <colgroup>
        <col class="col-month">
        <col class="col-week">
        <col class="col-day">
        <col class="col-day">
        <col class="col-day">
        <col class="col-day">
        <col class="col-day">
        <col class="col-day">
        <col class="col-day">
      </colgroup>
      <thead>
        <tr>
          <th class="th-month"></th>
          <th class="th-week">WK</th>
          <th class="th-sun">Sun</th>
          <th>Mon</th>
          <th>Tue</th>
          <th>Wed</th>
          <th>Thu</th>
          <th>Fri</th>
          <th class="th-sat">Sat</th>
        </tr>
      </thead>
      <tbody id="calBody"></tbody>
    </table>
  </div>

  <!-- LEGEND -->
  <div class="legend">
    <div class="legend-item">
      <div class="legend-swatch ls-today"></div>
      <span>Today</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch ls-select"></div>
      <span>Selected</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch ls-holiday"></div>
      <span>Federal Holiday</span>
    </div>
  </div>

</div>

<script>
// ── UTILITIES ────────────────────────────────────────────────────────────────

const today = new Date();
today.setHours(0, 0, 0, 0);

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth()    === b.getMonth()    &&
         a.getDate()     === b.getDate();
}

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getWeekNum(d) {
  const utc = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = utc.getUTCDay() || 7;
  utc.setUTCDate(utc.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(utc.getUTCFullYear(), 0, 1));
  return Math.ceil(((utc - yearStart) / 86400000 + 1) / 7);
}

// ── FEDERAL HOLIDAYS ─────────────────────────────────────────────────────────

function getNthWeekday(year, month, weekday, n) {
  const d = new Date(year, month, 1);
  let count = 0;
  while (true) {
    if (d.getDay() === weekday) { count++; if (count === n) return d; }
    d.setDate(d.getDate() + 1);
  }
}

function getLastWeekday(year, month, weekday) {
  const d = new Date(year, month + 1, 0);
  while (d.getDay() !== weekday) d.setDate(d.getDate() - 1);
  return d;
}

function buildHolidays(year) {
  const h = {};
  function add(date, name) {
    h[dateKey(date)] = name;
    let obs = new Date(date);
    if (date.getDay() === 6) obs.setDate(date.getDate() - 1);
    else if (date.getDay() === 0) obs.setDate(date.getDate() + 1);
    if (dateKey(obs) !== dateKey(date)) h[dateKey(obs)] = name + ' (Observed)';
  }
  add(new Date(year,  0,  1), "New Year's Day");
  add(getNthWeekday(year, 0, 1, 3),    "Martin Luther King Jr. Day");
  add(getNthWeekday(year, 1, 1, 3),    "Presidents' Day");
  add(getLastWeekday(year, 4, 1),      "Memorial Day");
  add(new Date(year,  5, 19),          "Juneteenth");
  add(new Date(year,  6,  4),          "Independence Day");
  add(getNthWeekday(year, 8, 1, 1),    "Labor Day");
  add(getNthWeekday(year, 9, 1, 2),    "Columbus Day");
  add(new Date(year, 10, 11),          "Veterans Day");
  add(getNthWeekday(year, 10, 4, 4),   "Thanksgiving Day");
  add(new Date(year, 11, 25),          "Christmas Day");
  return h;
}

const holidays = {};
const thisYear = today.getFullYear();
for (let y = thisYear - 1; y <= thisYear + 2; y++) {
  Object.assign(holidays, buildHolidays(y));
}

// ── DATE RANGE ───────────────────────────────────────────────────────────────

const startDate = new Date(today);
startDate.setFullYear(startDate.getFullYear() - 1);
while (startDate.getDay() !== 0) startDate.setDate(startDate.getDate() - 1);

const endDate = new Date(today);
endDate.setMonth(endDate.getMonth() + 12);
while (endDate.getDay() !== 6) endDate.setDate(endDate.getDate() + 1);

// ── GENERATE WEEKS ───────────────────────────────────────────────────────────

const weeks = [];
const cur = new Date(startDate);
while (cur <= endDate) {
  const week = [];
  for (let d = 0; d < 7; d++) {
    week.push(new Date(cur));
    cur.setDate(cur.getDate() + 1);
  }
  weeks.push(week);
}

// ── MONTH GROUPS ─────────────────────────────────────────────────────────────

const monthGroups = [];
let prevMK = null;
weeks.forEach((week, i) => {
  const sun = week[0];
  const mk = `${sun.getFullYear()}-${sun.getMonth()}`;
  if (mk !== prevMK) {
    monthGroups.push({ month: sun.getMonth(), year: sun.getFullYear(), startRow: i, rowspan: 0 });
    prevMK = mk;
  }
  monthGroups[monthGroups.length - 1].rowspan++;
});

const rowToMG = {};
monthGroups.forEach(mg => {
  for (let r = mg.startRow; r < mg.startRow + mg.rowspan; r++) rowToMG[r] = mg;
});

monthGroups.forEach((mg, i) => { mg.idx = i; });

const MONTH_NAMES = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];

function mlColorClass(mg) {
  return mg.idx % 2 === 0 ? 'ml-even' : 'ml-odd';
}

function dayColorClass(date) {
  const absMonth = date.getFullYear() * 12 + date.getMonth();
  return absMonth % 2 === 0 ? 'month-even' : 'month-odd';
}

// ── BUILD TABLE ───────────────────────────────────────────────────────────────

const tbody       = document.getElementById('calBody');
const allCells    = [];
const weekNumCells = [];
let todayRow = null;

weeks.forEach((week, rowIdx) => {
  const tr = document.createElement('tr');
  tr.dataset.rowIdx = rowIdx;

  const mg = rowToMG[rowIdx];

  if (mg && mg.startRow === rowIdx) {
    const td = document.createElement('td');
    td.className = `month-label ${mlColorClass(mg)}`;
    td.rowSpan = mg.rowspan;
    td.innerHTML = `<div class="month-inner"><span class="month-name">${MONTH_NAMES[mg.month]}</span><span class="month-year">${mg.year}</span></div>`;
    td.addEventListener('click', e => { e.stopPropagation(); handleMonthClick(mg, td); });
    mg.labelTd = td;
    tr.appendChild(td);
  }

  if (!mg.rows) mg.rows = [];
  mg.rows.push(tr);

  const wkTd = document.createElement('td');
  wkTd.className = 'week-num';
  wkTd.textContent = String(getWeekNum(week[0])).padStart(2, '0');
  wkTd.title = 'Click to highlight week';
  wkTd.addEventListener('click', e => { e.stopPropagation(); handleWeekClick(tr); });
  weekNumCells[rowIdx] = wkTd;
  tr.appendChild(wkTd);

  week.forEach((date, dayIdx) => {
    const td = document.createElement('td');
    td.className = 'day-cell';
    td.classList.add(dayColorClass(date));

    if (date.getDate() === 1 && dayIdx > 0) {
      td.classList.add('month-start');
    }

    const hk = dateKey(date);
    if (holidays[hk]) {
      td.classList.add('holiday');
      td.dataset.holiday = holidays[hk];

      const isObserved = holidays[hk].includes('(Observed)');

      const nicknames = {
        "New Year's Day":             d => String(d.getFullYear()),
        "Martin Luther King Jr. Day": () => 'MLK',
        "Presidents' Day":            () => 'Presidents\nDay',
        "Memorial Day":               () => 'Memorial\nDay',
        "Juneteenth":                 () => 'Juneteenth',
        "Independence Day":           () => '4th\nJuly',
        "Labor Day":                  () => 'Labor\nDay',
        "Columbus Day":               () => 'Columbus\nDay',
        "Veterans Day":               () => 'Veterans\nDay',
        "Thanksgiving Day":           () => 'Thanksgiving',
        "Christmas Day":              () => 'Christmas',
      };

      const matchKey = Object.keys(nicknames).find(k => holidays[hk] === k);
      if (!isObserved && matchKey) {
        const nick = nicknames[matchKey](date);
        td.classList.add('holiday-named');
        td.dataset.nick = nick;
        const lines = nick.split('\n');
        td.innerHTML = `<div class="holiday-nick">${lines.map((l,i) => `<span class="${i===0?'hk-name':'hk-date'}">${l}</span>`).join('')}</div>`;
      }
    }

    if (sameDay(date, today)) {
      td.classList.add('today');
      todayRow = tr;
    }

    td.textContent = date.getDate();
    if (td.classList.contains('holiday-named')) {
      const nick = td.dataset.nick;
      const lines = nick.split('\n');
      td.innerHTML = `<div class="holiday-nick">${lines.map((l,i) => `<span class="${i===0?'hk-name':'hk-date'}">${l}</span>`).join('')}</div>`;
    }

    if (!allCells[rowIdx]) allCells[rowIdx] = [];
    allCells[rowIdx][dayIdx] = td;
    tr.appendChild(td);
  });

  tbody.appendChild(tr);
});

// ── DATE → CELL LOOKUP ───────────────────────────────────────────────────────

const dateToCell = {};
weeks.forEach((week, rowIdx) => {
  week.forEach((date, dayIdx) => {
    dateToCell[dateKey(date)] = { rowIdx, dayIdx };
  });
});

// ── COUNTER ──────────────────────────────────────────────────────────────────

const diffCircle = document.getElementById('diffCircle');
const diffNum    = document.getElementById('diffNum');

function updateCounter(count) {
  if (!count) {
    diffCircle.classList.remove('has-value');
    diffNum.textContent = '—';
    return;
  }
  diffCircle.classList.add('has-value');
  diffNum.textContent = count;
}

// ── SELECTION STATE ───────────────────────────────────────────────────────────

let selectedWeek  = null;
let selectedMonth = null;
let dragRangeCells = [];

function clearDragRange() {
  dragRangeCells.forEach(td => td.classList.remove('drag-range','drag-t','drag-b','drag-l','drag-r'));
  dragRangeCells = [];
}

function clearAll() {
  if (selectedWeek)  { selectedWeek.classList.remove('selected-week');  selectedWeek  = null; }
  if (selectedMonth) {
    if (selectedMonth.hlCells) {
      selectedMonth.hlCells.forEach(td => td.classList.remove('mhl','mhl-t','mhl-b','mhl-l','mhl-r'));
    }
    if (selectedMonth.labelTd) selectedMonth.labelTd.classList.remove('selected-month-label');
    selectedMonth = null;
  }
  clearDragRange();
  updateCounter(0);
}

function highlightMonth(mg) {
  const m = mg.month, y = mg.year;
  const inSet = new Set();
  for (let ri = 0; ri < weeks.length; ri++) {
    for (let di = 0; di < 7; di++) {
      const d = weeks[ri][di];
      if (d.getMonth() === m && d.getFullYear() === y) inSet.add(`${ri}-${di}`);
    }
  }
  const hlCells = [];
  inSet.forEach(key => {
    const [ri, di] = key.split('-').map(Number);
    const td = allCells[ri] && allCells[ri][di];
    if (!td) return;
    td.classList.add('mhl');
    if (!inSet.has(`${ri-1}-${di}`)) td.classList.add('mhl-t');
    if (!inSet.has(`${ri+1}-${di}`)) td.classList.add('mhl-b');
    if (!inSet.has(`${ri}-${di-1}`)) td.classList.add('mhl-l');
    if (!inSet.has(`${ri}-${di+1}`)) td.classList.add('mhl-r');
    hlCells.push(td);
  });
  mg.hlCells = hlCells;
}

function handleMonthClick(mg, td) {
  const wasMe = selectedMonth === mg;
  clearAll();
  if (!wasMe) {
    highlightMonth(mg);
    td.classList.add('selected-month-label');
    mg.labelTd = td;
    selectedMonth = mg;
    updateCounter(new Date(mg.year, mg.month + 1, 0).getDate());
  }
}

function handleWeekClick(tr) {
  const wasMe = tr === selectedWeek;
  clearAll();
  if (!wasMe) {
    tr.classList.add('selected-week');
    selectedWeek = tr;
    updateCounter(7);
  }
}

// ── DRAG RANGE SELECTION ─────────────────────────────────────────────────────

function getCellDate(td) {
  const tr = td.closest('tr');
  if (!tr) return null;
  const rowIdx = parseInt(tr.dataset.rowIdx);
  const dayIdx = Array.from(tr.querySelectorAll('td.day-cell')).indexOf(td);
  return (weeks[rowIdx] && dayIdx >= 0) ? weeks[rowIdx][dayIdx] : null;
}

function applyRangeHighlight(dateA, dateB) {
  clearDragRange();

  const s = dateA <= dateB ? dateA : dateB;
  const e = dateA <= dateB ? dateB : dateA;

  const inSet = new Set();
  const c = new Date(s);
  while (c <= e) {
    const cell = dateToCell[dateKey(c)];
    if (cell) inSet.add(`${cell.rowIdx}-${cell.dayIdx}`);
    c.setDate(c.getDate() + 1);
  }

  inSet.forEach(key => {
    const [ri, di] = key.split('-').map(Number);
    const td = allCells[ri]?.[di];
    if (!td) return;
    td.classList.add('drag-range');
    if (!inSet.has(`${ri-1}-${di}`)) td.classList.add('drag-t');
    if (!inSet.has(`${ri+1}-${di}`)) td.classList.add('drag-b');
    if (!inSet.has(`${ri}-${di-1}`)) td.classList.add('drag-l');
    if (!inSet.has(`${ri}-${di+1}`)) td.classList.add('drag-r');
    dragRangeCells.push(td);
  });

  updateCounter(inSet.size);
}

// ── MOUSE DRAG ───────────────────────────────────────────────────────────────

let isDragging       = false;
let dragMode         = null; // 'day' | 'week'
let dragAnchor       = null;
let dragCurrent      = null;
let dragAnchorRow    = null;
let dragCurrentRow   = null;

const calTable = document.getElementById('calTable');

function applyWeekRangeHighlight(rowA, rowB) {
  const startRow = Math.min(rowA, rowB);
  const endRow   = Math.max(rowA, rowB);
  applyRangeHighlight(weeks[startRow][0], weeks[endRow][6]);
  // Also highlight week-num cells with left border
  for (let ri = startRow; ri <= endRow; ri++) {
    const wk = weekNumCells[ri];
    if (!wk) continue;
    wk.classList.add('drag-range', 'drag-l');
    if (ri === startRow) wk.classList.add('drag-t');
    if (ri === endRow)   wk.classList.add('drag-b');
    dragRangeCells.push(wk);
  }
}

calTable.addEventListener('mousedown', e => {
  const dayTd  = e.target.closest('td.day-cell');
  const weekTd = e.target.closest('td.week-num');
  if (!dayTd && !weekTd) return;
  e.preventDefault();
  isDragging = true;
  clearAll();

  if (dayTd) {
    dragMode   = 'day';
    dragAnchor = getCellDate(dayTd);
    dragCurrent = dragAnchor;
    if (dragAnchor) applyRangeHighlight(dragAnchor, dragCurrent);
  } else {
    dragMode       = 'week';
    dragAnchorRow  = parseInt(weekTd.closest('tr').dataset.rowIdx);
    dragCurrentRow = dragAnchorRow;
    applyWeekRangeHighlight(dragAnchorRow, dragCurrentRow);
  }
});

calTable.addEventListener('mousemove', e => {
  if (!isDragging) return;

  if (dragMode === 'day') {
    if (!dragAnchor) return;
    const td = e.target.closest('td.day-cell');
    if (!td) return;
    const d = getCellDate(td);
    if (!d || (dragCurrent && d.getTime() === dragCurrent.getTime())) return;
    dragCurrent = d;
    applyRangeHighlight(dragAnchor, dragCurrent);
  } else if (dragMode === 'week') {
    const td = e.target.closest('td.day-cell, td.week-num');
    if (!td) return;
    const tr = td.closest('tr');
    if (!tr) return;
    const rowIdx = parseInt(tr.dataset.rowIdx);
    if (isNaN(rowIdx) || rowIdx === dragCurrentRow) return;
    dragCurrentRow = rowIdx;
    applyWeekRangeHighlight(dragAnchorRow, dragCurrentRow);
  }
});

document.addEventListener('mouseup', () => { isDragging = false; });

// Stop table clicks reaching the document clear-all listener
calTable.addEventListener('click', e => e.stopPropagation());

// ── TOUCH DRAG (long-press to enter drag mode, then any direction) ────────────

let touchAnchor     = null;
let touchInDrag     = false;
let touchLast       = null;
let touchTimer      = null;
let touchStartX     = 0;
let touchStartY     = 0;

calTable.addEventListener('touchstart', e => {
  const touch = e.touches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  touchInDrag = false;
  touchLast   = null;

  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const td = el && el.closest('td.day-cell');
  touchAnchor = td ? getCellDate(td) : null;

  if (touchAnchor) {
    touchTimer = setTimeout(() => {
      touchInDrag = true;
      clearAll();
      applyRangeHighlight(touchAnchor, touchAnchor);
      if (navigator.vibrate) navigator.vibrate(15);
    }, 280);
  }
}, { passive: true });

calTable.addEventListener('touchmove', e => {
  const touch = e.touches[0];

  if (!touchInDrag) {
    // Cancel long-press if finger moved too much (user is scrolling)
    const dx = Math.abs(touch.clientX - touchStartX);
    const dy = Math.abs(touch.clientY - touchStartY);
    if ((dx > 8 || dy > 8) && touchTimer) {
      clearTimeout(touchTimer);
      touchTimer = null;
    }
    return;
  }

  e.preventDefault();
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const td = el && el.closest('td.day-cell');
  if (!td) return;
  const d = getCellDate(td);
  if (!d || (touchLast && d.getTime() === touchLast.getTime())) return;
  touchLast = d;
  applyRangeHighlight(touchAnchor, d);
}, { passive: false });

calTable.addEventListener('touchend', () => {
  clearTimeout(touchTimer);
  touchTimer = null;
  // Simple tap (no drag): select single day
  if (!touchInDrag && touchAnchor) {
    clearAll();
    applyRangeHighlight(touchAnchor, touchAnchor);
  }
  touchInDrag = false;
  touchAnchor = null;
  touchLast   = null;
}, { passive: true });

// Click anywhere outside calendar → clear selection
document.addEventListener('click', () => clearAll());

// ── SCROLL TO TODAY ───────────────────────────────────────────────────────────

function scrollToToday() {
  if (todayRow) todayRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

setTimeout(scrollToToday, 80);
</script>
</div><!-- .page -->
</div><!-- .page-outer -->
